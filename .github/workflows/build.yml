name: Build Shizo 95 (.AppImage & .apk)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Сборка Linux AppImage (x86_64)
  # ============================================================================
  build-linux-appimage:
    name: Build Linux AppImage (x86_64)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies (WebKitGTK & PyGObject)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.0-37 \
            libwebkit2gtk-4.0-dev \
            libgirepository1.0-dev \
            gobject-introspection \
            gir1.2-webkit2-4.0 \
            gir1.2-gtk-3.0 \
            python3-gi \
            python3-gi-cairo \
            file

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install pywebview pyinstaller PyGObject

      - name: Build AppImage via build_linux.sh
        run: |
          chmod +x build_linux.sh
          ./build_linux.sh

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizo95-Linux-x86_64-AppImage
          path: Shizo95-x86_64.AppImage
          retention-days: 14

  # ============================================================================
  # 2. Сборка Android .apk (Release / Debug)
  # ============================================================================
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Sync web assets into Android project
        run: |
          chmod +x android/copy_assets.sh
          ./android/copy_assets.sh

      - name: Prepare Gradle Wrapper and Build APK
        run: |
          cd android/native-webview
          if [ ! -f "gradlew" ]; then
            gradle wrapper --gradle-version 8.4 --distribution-type bin
          fi
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Locate and copy output APK
        run: |
          mkdir -p output_apk
          find android/native-webview/app/build/outputs/apk/ -type f -name "*.apk" -exec cp {} output_apk/Shizo95.apk \;

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shizo95-Android-APK
          path: output_apk/Shizo95.apk
          retention-days: 14

  # ============================================================================
  # 3. Автоматический релиз на GitHub (при пуше тега v*)
  # ============================================================================
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-appimage, build-android-apk]
    runs-on: ubuntu-latest

    steps:
      - name: Download Linux AppImage
        uses: actions/download-artifact@v4
        with:
          name: Shizo95-Linux-x86_64-AppImage
          path: ./release_assets

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Shizo95-Android-APK
          path: ./release_assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release_assets/Shizo95-x86_64.AppImage
            ./release_assets/Shizo95.apk
          tag_name: ${{ github.ref_name }}
          name: Шизо 95: Клинический синтезатор ${{ github.ref_name }}
          body: |
            ## Релиз «Шизо 95: Клинический синтезатор v4.2»
            
            ### Бинарные автономные пакеты:
            - **Linux (x86_64):** `Shizo95-x86_64.AppImage` (автономный исполняемый файл, WebKitGTK, EarthBound Canvas)
            - **Android:** `Shizo95.apk` (автономное приложение с аппаратным ускорением)
            
            ### Возможности:
            - 100% офлайн работа без внешних серверов и API.
            - Интерактивное окно Windows 95: свободное перемещение (drag & drop), растягивание во все 8 сторон (8-direction resize), кнопки «Свернуть в плашку», «Развернуть/Восстановить», «Закрыть» и тумблер Ghost Mode (ретро-полупрозрачность).
            - Движок EarthBound Battle Background: горизонтальный синусоидальный сдвиг строк ($x' = x + A \sin(k y + \omega t)$), плавное циклическое смешивание палитр в комфортных тонах (индиго, изумрудный мох, приглушённый пурпур, тёмный янтарь), мягкое завихрение при ресинтезе мысли без вспышек и стробоскопов (Photosensitive Safe).
            - Процедурный математический генератор шизофазии (CFG + морфемный мутатор неологизмов) по 4 клиническим профилям с защитой от повторов.
            - Встроенный пиксельный шрифт с поддержкой кириллицы, латиницы и корейского хангыля.
            - Аутентичные 8-битные звуковые эффекты через Web Audio API.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
